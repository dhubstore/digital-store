<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | DHub Digital Store</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="checkout.css">

</head>

<body>

<header class="checkout-header">

<a href="index.html" class="logo">

<i class="fa-solid fa-bolt"></i>

DHub Digital Store

</a>

</header>

<main class="checkout-container">

<section class="customer-card">

<h2>Customer Information</h2>

<form id="checkoutForm">

<div class="form-group">

<label>Full Name</label>

<input type="text" id="name" required>

</div>

<div class="form-group">

<label>Email Address</label>

<input type="email" id="email" required>

</div>

<div class="form-group">

<label>Phone Number</label>

<input type="tel" id="phone" required>

</div>

<div class="form-group">

<label>Country</label>

<input type="text" id="country" value="Ghana">

</div>

<div class="form-group">

<label>Order Notes</label>

<textarea id="notes"></textarea>

</div>

<h3>Payment Method</h3>

<div class="payment-list">

<label><input type="radio" name="payment" value="MTN MoMo" checked> MTN Mobile Money</label>

<label><input type="radio" name="payment" value="Telecel Cash"> Telecel Cash</label>

<label><input type="radio" name="payment" value="AirtelTigo Money"> AirtelTigo Money</label>

<label><input type="radio" name="payment" value="Visa / Mastercard"> Visa / Mastercard</label>

</div>

<div class="coupon-box">

<input type="text"

id="coupon"

placeholder="Coupon Code">

<button type="button"

id="applyCoupon">

Apply

</button>

</div>

<label class="terms">

<input type="checkbox" required>

I agree to the Terms & Conditions

</label>

<button type="submit"

class="place-order">

Place Order

</button>

</form>

</section>

<aside class="summary-card">

<h2>Order Summary</h2>

<div id="checkoutItems"></div>

<div class="summary-row">

<span>Subtotal</span>

<span id="subtotal">GHS 0.00</span>

</div>

<div class="summary-row">

<span>Discount</span>

<span id="discount">GHS 0.00</span>

</div>

<div class="summary-row total">

<span>Total</span>

<span id="total">GHS 0.00</span>

</div>

</aside>

</main>

<script src="checkout.js"></script>

</body>

</html>
