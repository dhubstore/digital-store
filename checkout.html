<!DOCTYPE html>

<html lang="en">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">



<title>DHub Checkout</title>



<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">



<link rel="preconnect"
href="https://fonts.googleapis.com">



<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">



<link rel="stylesheet" href="style.css">



</head>





<body>





<!-- HEADER -->


<header class="navbar">


<div class="logo">


<i class="fa-solid fa-bolt"></i>


<div>


<h2>

DHub

</h2>


<p>

Checkout

</p>


</div>


</div>



</header>








<section class="checkout-page">


<div class="container">





<div class="section-header">


<h2>

Complete Your Order

</h2>


<p>

Fill in your information and confirm payment

</p>


</div>






<div class="checkout-layout">







<!-- ORDER SUMMARY -->


<div class="receipt-card">


<h2>

Your Order

</h2>




<div id="orderSummary">


</div>




</div>




<!-- CUSTOMER FORM -->


<div class="form-card">



<h2>

Customer Information

</h2>





<form id="orderForm">





<input

type="text"

id="custName"

placeholder="Full Name"

required>






<input

type="tel"

id="custPhone"

placeholder="Phone Number"

required>






<input

type="email"

id="custEmail"

placeholder="Email Address"

required>








<select id="paymentMethod" required>



<option value="">

Select Payment Method

</option>




<option value="tcash">

Telecel Cash (T-Cash)

</option>




<option value="bank">

Bank Transfer

</option>




</select>








<!-- PAYMENT REFERENCE -->


<div class="payment-box">



<h3>

Payment Reference

</h3>



<input

type="text"

id="paymentProof"

readonly>



<p>

Use this reference when making payment.

</p>



</div>








<!-- PRODUCT INFORMATION -->


<div id="extraFields">



<h3>

Product Information

</h3>



<p class="small-text">

For account products, provide required details.

</p>




<input

type="text"

id="accountEmail"

placeholder="Account Email / Username (Optional)">





<input

type="password"

id="accountPassword"

placeholder="Account Password (Optional)">





<input

type="text"

id="extraNote"

placeholder="Additional Notes">





</div>








<!-- PAYMENT DETAILS -->


<div class="payment-box" id="paymentDetails">



</div>








<button

type="submit"

class="checkout-btn">


Place Order


</button>






</form>




</div>






</div>


</div>


</section>








<!-- FOOTER -->


<footer class="footer">


<div class="container">


<div class="copyright">


© 2026 DHub Digital Store. All Rights Reserved.


</div>


</div>


</footer>








<!-- EMAILJS -->


<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>



<script src="checkout.js"></script>





<script>


document

.getElementById("orderForm")

.addEventListener(

"submit",

function(e){


e.preventDefault();


submitOrder();


}

);


</script>





</body>


</html>
