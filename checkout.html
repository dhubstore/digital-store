<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - DHub Store</title>
<link rel="stylesheet" href="style.css">
</head>

<body style="padding:20px;">

<h2 style="text-align:center;">Checkout</h2>

<!-- RECEIPT -->
<div id="orderSummary"></div>

<br>

<!-- CUSTOMER DETAILS -->
<input type="text" id="custName" placeholder="Full Name"><br><br>
<input type="text" id="custPhone" placeholder="Phone Number"><br><br>
<input type="email" id="custEmail" placeholder="Email"><br><br>

<!-- PAYMENT -->
<h3>Payment Method</h3>
<select id="paymentMethod">
  <option value="momo">Mobile Money</option>
  <option value="bank">Bank (Coming Soon)</option>
</select>

<div id="paymentDetails"></div>

<br>

<input type="text" id="paymentProof" readonly>

<br><br>

<button onclick="submitOrder()">Submit Order</button>

<!-- LINK JS FILE -->
<script src="checkout.js"></script>

</body>
</html>
