<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - DHub Store</title>
<link rel="stylesheet" href="style.css">

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
  emailjs.init("rXSSrejIU73iYS-Cv");
})();
</script>

</head>

<body>

<div class="checkout-container">

  <h1 class="title">Checkout</h1>

  <!-- RECEIPT -->
  <div id="orderSummary" class="receipt-card"></div>

  <!-- FORM -->
  <div class="form-card">
    <input type="text" id="custName" placeholder="Full Name">
    <input type="text" id="custPhone" placeholder="Phone Number">
    <input type="email" id="custEmail" placeholder="Email">

    <h3>Payment Method</h3>
    <select id="paymentMethod">
      <option value="momo">Mobile Money</option>
      <option value="bank">Bank (Coming Soon)</option>
    </select>

    <div id="paymentDetails" class="payment-box"></div>

    <input type="text" id="paymentProof" readonly>

    <button class="pay-btn" onclick="submitOrder()">Complete Order</button>
  </div>

</div>

<script src="checkout.js"></script>

</body>
</html>
