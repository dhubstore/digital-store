<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHub Digital Store</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>DHub Digital Store</h1>
  <p>Fast & Reliable Digital Services</p>
</header>

<div class="cart-icon" onclick="toggleCart()">
  🛒 <span id="cartCount">0</span>
</div>

<nav>
  <button onclick="filterProducts('all')">All</button>
  <button onclick="filterProducts('data')">Data</button>
  <button onclick="filterProducts('subscription')">Subscriptions</button>
  <button onclick="filterProducts('vpn')">VPN</button>
</nav>

<section class="products" id="productList"></section>

<!-- CART -->
<div class="cart-box" id="cartBox">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
  <h3 id="total"></h3>
  <button onclick="checkout()">Checkout via WhatsApp</button>
</div>

<script src="script.js"></script>
</body>
</html>
