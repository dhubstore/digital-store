<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Hub Store</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="logo">Digital Hub</div>

  <div class="search-box">
    <input type="text" placeholder="Search Netflix, VPN, Data..." />
  </div>

  <div class="cart-wrapper">
    🛒
    <div id="cartCount">0</div>
  </div>

</header>

<!-- HERO -->
<section class="hero">
  <h1>Welcome to Digital Hub Store</h1>
  <p>Your trusted store for VPN accounts, Netflix accounts, TextNow numbers & data bundles.</p>
</section>

<!-- PRODUCTS -->
<div class="products-list">

  <div class="product-card">
    <div class="product-info">
      <img src="https://via.placeholder.com/60" alt="">
      <div class="product-details">
        <span>Netflix Account</span>
      </div>
    </div>

    <div class="product-price-stock">
      <div class="price">$5</div>
      <div class="btns">
        <button class="purchase-btn">Buy</button>
        <button class="add-cart-btn">Add</button>
      </div>
    </div>
  </div>

  <div class="product-card">
    <div class="product-info">
      <img src="https://via.placeholder.com/60" alt="">
      <div class="product-details">
        <span>VPN Premium</span>
      </div>
    </div>

    <div class="product-price-stock">
      <div class="price">$3</div>
      <div class="btns">
        <button class="purchase-btn">Buy</button>
        <button class="add-cart-btn">Add</button>
      </div>
    </div>
  </div>

</div>

<!-- SIDE CART -->
<div id="sideCart">

  <div id="sideCartHeader">
    <h3>Your Cart</h3>
    <span id="closeSideCart">✖</span>
  </div>

  <div class="cart-item">
    <span>Example Item</span>
    <button>Remove</button>
  </div>

  <div id="sideCartTotal">Total: $0</div>

  <input type="text" placeholder="Your Name">
  <input type="text" placeholder="WhatsApp Number">

  <button>Checkout</button>

</div>

<!-- FLOATING BUTTONS -->
<button id="whatsappBtn">
  <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
</button>

<button id="supportBtn">
  <img src="https://cdn-icons-png.flaticon.com/512/724/724664.png">
</button>

<button id="requestBtn">Request Product</button>

<!-- MODAL -->
<div class="modal" id="requestModal">
  <div class="modal-content">
    <span class="close">&times;</span>

    <h3>Request a Product</h3>

    <form id="requestForm">
      <input type="text" placeholder="Product Name">
      <textarea placeholder="Details"></textarea>
      <button type="submit">Send Request</button>
    </form>

  </div>
</div>

<footer>
  <p>© 2026 Digital Hub Store</p>
</footer>

</body>
</html>
