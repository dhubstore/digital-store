<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Digital Hub Store</title>  <style>  
* {  
  margin: 0;  
  padding: 0;  
  box-sizing: border-box;  
  font-family: Arial, sans-serif;  
}  
  
/* HEADER */  
.header {  
  display: flex;  
  align-items: center;  
  justify-content: space-between;  
  padding: 12px 16px;  
  background: linear-gradient(90deg, #6a11cb, #2575fc);  
  position: sticky;  
  top: 0;  
  z-index: 1000;  
}  
  
/* LOGO */  
.logo {  
  color: white;  
  font-size: 20px;  
  font-weight: bold;  
}  
  
/* SEARCH BAR */  
.search-box {  
  flex: 1;  
  margin: 0 12px;  
  position: relative;  
}  
  
.search-box input {  
  width: 100%;  
  padding: 10px 40px 10px 15px;  
  border-radius: 25px;  
  border: none;  
  outline: none;  
  font-size: 14px;  
}  
  
/* SEARCH ICON */  
.search-box::after {  
  content: "🔍";  
  position: absolute;  
  right: 12px;  
  top: 50%;  
  transform: translateY(-50%);  
  font-size: 14px;  
}  
  
/* CART */  
.cart {  
  position: relative;  
  font-size: 22px;  
  color: white;  
  cursor: pointer;  
}  
  
/* CART BADGE */  
.cart span {  
  position: absolute;  
  top: -6px;  
  right: -8px;  
  background: red;  
  color: white;  
  font-size: 12px;  
  padding: 2px 6px;  
  border-radius: 50%;  
}  
  
/* HERO SECTION */  
.hero {  
  margin: 20px;  
  padding: 30px 20px;  
  border-radius: 20px;  
  background: linear-gradient(135deg, #0072ff, #00c6ff);  
  color: white;  
  text-align: center;  
}  
  
.hero h1 {  
  font-size: 24px;  
  margin-bottom: 10px;  
}  
  
.hero p {  
  font-size: 15px;  
  line-height: 1.5;  
}  
  
/* MOBILE IMPROVEMENTS */  
@media (max-width: 600px) {  
  .logo {  
    font-size: 16px;  
  }  
  
  .search-box input {  
    font-size: 12px;  
    padding: 8px 35px 8px 12px;  
  }  
  
  .hero h1 {  
    font-size: 20px;  
  }  
  
  .hero p {  
    font-size: 13px;  
  }  
}  
</style>  </head>  <body>  <!-- HEADER -->  <header class="header">  
  <div class="logo">Digital Hub</div>    <div class="search-box">  
    <input type="text" placeholder="Search Netflix, VPN, Data..." />  
  </div>    <div class="cart">  
    🛒  
    <span>0</span>  
  </div>  
</header>  <!-- HERO -->  <section class="hero">  
  <h1>Welcome to Digital Hub Store</h1>  
  <p>  
    Your trusted store for VPN accounts, Netflix accounts,  
    TextNow/TextFree numbers, and data bundles.  
  </p>  
</section>  </body>  
</html>
