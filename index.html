<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHub Digital Store</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>DHub Digital Store</h1>
  <p>Fast & Reliable Digital Services</p>
</header>

<div class="cart-icon" onclick="toggleCart()">
  🛒 <span id="cartCount">0</span>
</div>

<nav>
  <button onclick="filterProducts('all')">All</button>
  <button onclick="filterProducts('data')">Data</button>
  <button onclick="filterProducts('subscription')">Subscriptions</button>
  <button onclick="filterProducts('vpn')">VPN</button>
</nav>

<section class="products" id="productList"></section>
<!-- TRUST SECTION -->
<div class="trust">
  <h2>Why Choose Us?</h2>
  <p>✔ Fast Delivery</p>
  <p>✔ Trusted Services</p>
  <p>✔ Secure Orders</p>
</div>

<!-- ORDER COUNTER -->
<h3 style="text-align:center;">
  ✅ 1,200+ Orders Delivered
</h3>

<!-- TESTIMONIALS -->
<div class="testimonials">
  <h2 style="text-align:center;">Customer Reviews</h2>

  <div class="card">
    <p>"Got my VPN instantly. Trusted seller!"</p>
    <b>- Customer</b>
  </div>

  <div class="card">
    <p>"Fast delivery and smooth process."</p>
    <b>- Customer</b>
  </div>
</div>
  
<!-- CART -->
<div class="cart-box" id="cartBox">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
  <h3 id="total"></h3>
  <button onclick="checkout()">Checkout via WhatsApp</button>
</div>

<script src="script.js"></script>
</body>
</html>
