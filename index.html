<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DHub Digital Store</title>

<meta name="description" content="Premium Digital Marketplace">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!--================ HEADER ================-->

<header class="header">

<div class="container">

<div class="left">

<button class="menu-btn">

<i class="fa-solid fa-bars"></i>

</button>

<a href="#" class="logo">

<span>D</span>Hub

</a>

</div>

<div class="search-box">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="text"
placeholder="Search products...">

</div>

<div class="right">

<a href="#">

<i class="fa-brands fa-whatsapp"></i>

</a>

<button>

<i class="fa-solid fa-cart-shopping"></i>

<span class="cart-count">0</span>

</button>

<button>

<i class="fa-regular fa-user"></i>

</button>

</div>

</div>

</header>

<!--================ HERO ================-->

<!--================ HERO =================-->

<section class="hero">

    <div class="hero-slider" id="heroSlider">

        <!-- Slide 1 -->
        <div class="hero-slide active">

            <div class="hero-text">

                <span class="badge">🔥 BIG DEALS</span>

                <h1>GET PREMIUM<br>ACCOUNTS & MORE</h1>

                <p>Netflix • Spotify • VPN • Gift Cards • Data Bundles</p>

                <button onclick="location.href='#products'">
                    SHOP NOW
                </button>

            </div>

            <div class="hero-image">

                <img src="images/banner1.png" alt="Banner 1">

            </div>

        </div>

        <!-- Slide 2 -->

        <div class="hero-slide">

            <div class="hero-text">

                <span class="badge">⚡ FLASH SALE</span>

                <h1>VPNs<br>AT LOW PRICES</h1>

                <p>ExpressVPN • NordVPN • PIA VPN</p>

                <button onclick="location.href='#products'">

                    BUY NOW

                </button>

            </div>

            <div class="hero-image">

                <img src="images/banner2.png" alt="Banner 2">

            </div>

        </div>

        <!-- Slide 3 -->

        <div class="hero-slide">

            <div class="hero-text">

                <span class="badge">🎁 NEW ARRIVALS</span>

                <h1>GIFT CARDS<br>& STREAMING</h1>

                <p>iTunes • Netflix • Spotify • Snapchat+</p>

                <button onclick="location.href='#products'">

                    EXPLORE

                </button>

            </div>

            <div class="hero-image">

                <img src="images/banner3.png" alt="Banner 3">

            </div>

        </div>

        <button class="hero-prev">&#10094;</button>

        <button class="hero-next">&#10095;</button>

        <div class="hero-dots">

            <span class="dot active"></span>

            <span class="dot"></span>

            <span class="dot"></span>

        </div>

    </div>

</section>  

<script src="app.js"></script>

</body>

</html>
